# Checks on every push/PR. The jobs themselves live in checks.yml so that
# release.yml can run the identical set before building — there is exactly one
# definition of "green".
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
