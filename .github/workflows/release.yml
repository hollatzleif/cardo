# Release pipeline: runs on a version tag (v1.0.0, v1.1.0, …).
# Builds signed installers for macOS/Windows/Linux and publishes them as a
# release on the PUBLIC repo (hollatzleif/cardo-app) incl. latest.json for
# the auto-updater.
#
# Required repo secrets:
#   TAURI_SIGNING_PRIVATE_KEY          – minisign private key (updater signature)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD – its password (empty string if none)
#   RELEASE_TOKEN                      – fine-grained PAT with "contents: write"
#                                        on hollatzleif/cardo-app (cross-repo publish)
#
# Budget note: macOS counts 10x in private repos. The universal build
# (~20 min ≙ 200 min quota) covers Apple Silicon AND Intel in one job.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  # Nothing gets built until the tagged commit itself is green.
  #
  # A tag is not a branch, so ci.yml (push to main / pull_request) never fired
  # on a tag push at all: between `git push origin v1.1.3` and installers for
  # every user there was not a single check. `workflow_run` cannot close this
  # either — it reacts to a branch run finishing and cannot tell you whether
  # THIS commit is good. Calling the reusable workflow can.
  gate:
    uses: ./.github/workflows/checks.yml
    with:
      full: true

  # Cheap, and catches a genuinely unrecoverable mistake: a tag whose version
  # disagrees with the manifests publishes a latest.json the updater can never
  # satisfy, so every installed app would keep offering an update that does not
  # apply.
  version-consistency:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match every manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected="${TAG#v}"
          fail=0
          check() {
            if [ "$2" != "$expected" ]; then
              echo "::error::$1 is $2, expected $expected (from tag $TAG)"
              fail=1
            else
              echo "ok: $1 = $2"
            fi
          }
          check package.json \
            "$(node -p "require('./package.json').version")"
          check apps/desktop/package.json \
            "$(node -p "require('./apps/desktop/package.json').version")"
          check tauri.conf.json \
            "$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          check Cargo.toml \
            "$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          exit $fail

  # The tag only exists in THIS private repo. Create the release on the
  # public repo up front (pointing at its own main), so the build jobs
  # merely upload assets instead of trying to create a cross-repo tag.
  prepare:
    needs: [gate, version-consistency]
    runs-on: ubuntu-24.04
    steps:
      - name: Ensure release exists on the public repo
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release view '${{ github.ref_name }}' -R hollatzleif/cardo-app >/dev/null 2>&1 || \
          gh release create '${{ github.ref_name }}' -R hollatzleif/cardo-app \
            --title 'Cardo ${{ github.ref_name }}' \
            --notes 'Installers for macOS, Windows and Linux are attached below. Install hints: https://hollatzleif.github.io/cardo-app/download'

  build:
    needs: [gate, version-consistency, prepare]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-24.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CARDO_GDRIVE_CLIENT_SECRET: ${{ secrets.CARDO_GDRIVE_CLIENT_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # llama.cpp needs std::filesystem → macOS 10.15+; we target 11.0.
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        with:
          projectPath: apps/desktop
          owner: hollatzleif
          repo: cardo-app
          tagName: ${{ github.ref_name }}
          releaseName: 'Cardo ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install. Full notes: CHANGELOG.md in the app repo.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
