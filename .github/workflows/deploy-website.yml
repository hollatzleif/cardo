# Deploys apps/website AND the iPhone home-screen web app (apps/desktop
# built with `--mode web`, served under /cardo-app/app/) to GitHub Pages of
# the PUBLIC repo (hollatzleif/cardo-app, branch gh-pages). Both ship in one
# publish, so a website deploy can never wipe the app or vice versa.
# Needs the same RELEASE_TOKEN secret as release.yml (cross-repo push).
name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'apps/website/**'
      - 'apps/desktop/src/**'
      - 'apps/desktop/vite/**'
      - 'apps/desktop/*.html'
      - 'apps/desktop/vite.config.ts'
      - 'packages/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website
        run: pnpm --filter @cardo/website build

      # The Google OAuth *web* client id is public by design (it is visible in
      # every page that signs in), so a repository variable is enough.
      - name: Build iPhone web app
        env:
          VITE_GDRIVE_WEB_CLIENT_ID: ${{ vars.GDRIVE_WEB_CLIENT_ID }}
        run: pnpm --filter @cardo/desktop build:web

      - name: Put the web app under /app
        run: cp -r apps/desktop/dist-web apps/website/dist/app

      - name: Publish to cardo-app gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.RELEASE_TOKEN }}
          external_repository: hollatzleif/cardo-app
          publish_branch: gh-pages
          publish_dir: apps/website/dist
